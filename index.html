<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бобёр ищет червей!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ЭКРАН 1: ТРУБА -->
  <div class="screen search-screen active" id="screen1">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>

    <div class="search-counter">
      Червяк <span class="count">1</span> из 6
    </div>

    <div class="search-content">
      <img class="beaver-search" src="characters/beaver.png" alt="Бобёр">

      <div class="object-search" id="obj-pipe">
        <img src="objects/pipe.png" alt="Труба">
      </div>
    </div>

    <div class="worm-search" onclick="findWorm(1, this)">
      <img src="worms/worm-search.png" alt="Червяк">
    </div>
  </div>

  <!-- ЭКРАН 2: МАШИНА -->
  <div class="screen search-screen" id="screen2">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>

    <div class="search-counter">
      Червяк <span class="count">2</span> из 6
    </div>

    <div class="search-content">
      <img class="beaver-search" src="characters/beaver.png" alt="Бобёр">

      <div class="object-search" id="obj-car">
        <img src="objects/car.png" alt="Машина">
      </div>
    </div>

    <div class="worm-search" onclick="findWorm(2, this)">
      <img src="worms/worm-search.png" alt="Червяк">
    </div>
  </div>

  <!-- ЭКРАН 3: РАКЕТКА -->
  <div class="screen search-screen" id="screen3">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>

    <div class="search-counter">
      Червяк <span class="count">3</span> из 6
    </div>

    <div class="search-content">
      <img class="beaver-search" src="characters/beaver.png" alt="Бобёр">

      <div class="object-search" id="obj-racket">
        <img src="objects/racket.png" alt="Ракетка">
      </div>
    </div>

    <div class="worm-search" onclick="findWorm(3, this)">
      <img src="worms/worm-search.png" alt="Червяк">
    </div>
  </div>

  <!-- ЭКРАН 4: КОРЗИНКА -->
  <div class="screen search-screen" id="screen4">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>

    <div class="search-counter">
      Червяк <span class="count">4</span> из 6
    </div>

    <div class="search-content">
      <img class="beaver-search" src="characters/beaver.png" alt="Бобёр">

      <div class="object-search" id="obj-basket">
        <img src="objects/basket.png" alt="Корзинка">
      </div>
    </div>

    <div class="worm-search" onclick="findWorm(4, this)">
      <img src="worms/worm-search.png" alt="Червяк">
    </div>
  </div>

  <!-- ЭКРАН 5: ГИТАРА -->
  <div class="screen search-screen" id="screen5">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>

    <div class="search-counter">
      Червяк <span class="count">5</span> из 6
    </div>

    <div class="search-content">
      <img class="beaver-search" src="characters/beaver.png" alt="Бобёр">

      <div class="object-search" id="obj-guitar">
        <img src="objects/guitar.png" alt="Гитара">
      </div>
    </div>

    <div class="worm-search" onclick="findWorm(5, this)">
      <img src="worms/worm-search.png" alt="Червяк">
    </div>
  </div>

  <!-- ЭКРАН 6: БАРАБАН -->
  <div class="screen search-screen" id="screen6">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>

    <div class="search-counter">
      Червяк <span class="count">6</span> из 6
    </div>

    <div class="search-content">
      <img class="beaver-search" src="characters/beaver.png" alt="Бобёр">

      <div class="object-search" id="obj-drum">
        <img src="objects/drum.png" alt="Барабан">
      </div>
    </div>

    <div class="worm-search" onclick="findWorm(6, this)">
      <img src="worms/worm-search.png" alt="Червяк">
    </div>
  </div>

  <!-- КАТ-СЦЕНА -->
  <div class="screen" id="cutscene">
    <div class="cutscene-content">
      <div class="cutscene-text">
        🎣 Бобёр поймал рыбу! Червяки убегают! 🪱💨
      </div>

      <img class="beaver-fishing" src="characters/beaver-fishing.png" alt="Бобёр рыбачит">

      <div class="running-worms">
        <img class="running-worm" src="worms/worm-running.png" alt="Червяк">
        <img class="running-worm" src="worms/worm-running.png" alt="Червяк">
        <img class="running-worm" src="worms/worm-running.png" alt="Червяк">
        <img class="running-worm" src="worms/worm-running.png" alt="Червяк">
        <img class="running-worm" src="worms/worm-running.png" alt="Червяк">
        <img class="running-worm" src="worms/worm-running.png" alt="Червяк">
      </div>

      <button class="next-btn" onclick="showScreen('screen-worms')">Дальше! →</button>
    </div>
  </div>

  <!-- ЭКРАН С НОРКАМИ -->
  <div class="screen" id="screen-worms">
    <div id="top-area">
      <img class="flower2" src="ui/flower1.png" alt="Цветок">
      <img class="flower2" src="ui/flower2.png" alt="Цветок">
      <img class="flower2" src="ui/flower1.png" alt="Цветок">
      <img class="flower2" src="ui/flower2.png" alt="Цветок">

      <div id="round-counter">Раунд: <span id="round-num">1</span> / 8</div>

      <div id="task-box">
        <h2> Найди норку!</h2>
        <p>Перетащи червяка в подходящую норку с такой же формой</p>
      </div>

      <div id="worm-container">
        <div id="chervyak"></div>
        <div id="chervyak-individual"></div>
      </div>

      <div id="bucket-container">
        <img id="bucket" src="ui/bucket.png" alt="Ведро">
      </div>
    </div>

    <div id="ground-area"></div>
    <div id="draggable-worm"></div>

    <div id="win-screen">
      <h1> Молодец! 🎉</h1>
      <div class="stars">⭐⭐⭐</div>
      <p class="win-text">Все червяки нашли свои норки!</p>
      <button id="restart-btn" onclick="restartGame()">Играть ещё! 🔄</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
