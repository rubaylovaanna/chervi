<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бобёр и червяки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ПРИВЕТСТВЕННЫЙ ПОПАП -->
  <div id="welcome-popup" class="popup">
    <div class="popup-content">
      <img src="ui/beaver-fishing.png" alt="Бобёр" class="popup-img">
      <p class="popup-text">Бобёр пошёл на рыбалку, но червяки сбежали из его ведра. Помоги им найти их норки!</p>
      <button id="start-btn" class="popup-btn">Старт</button>
    </div>
  </div>

  <!-- ЭКРАН: ИГРА С НОРКАМИ -->
  <div class="screen game-screen active" id="game-screen">
    <div class="game-area">
      <div class="task-area">
        <div id="current-worm-container">
          <img id="current-worm" src="" alt="Червяк">
        </div>
        <div id="task-text">Соедини червяка с норкой</div>
      </div>
      <div id="holes-row"></div>
    </div>
  </div>

  <!-- ПОПАП ПОЗДРАВЛЕНИЯ -->
  <div id="congrats-popup" class="popup hidden">
    <div class="popup-content">
      <h1 class="congrats-title">Молодец!</h1>
      <p class="popup-text">Все червяки нашли свои норки!</p>
      <button id="restart-btn" class="popup-btn">Начать сначала</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
